name: U2-A professional pen gate
on:
  pull_request:
    paths:
      - 'src/editor/pen.ts'
      - 'src/editor/types.ts'
      - 'src/editor/components/Stage.tsx'
      - 'src/editor/components/OptionsBar.tsx'
      - 'src/editor/__tests__/pen-u2a.test.ts'
      - 'e2e/pen-u2a.mjs'
      - '.github/workflows/u2a-pen.yml'
  workflow_dispatch:
jobs:
  pen-u2a:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run src/editor/__tests__/pen-u2a.test.ts src/editor/unified
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          (npx next start -p 3000 >/tmp/u2a-next.log 2>&1 &)
          for i in $(seq 1 60); do if curl -sf -o /dev/null http://localhost:3000/editor; then exit 0; fi; sleep 5; done
          cat /tmp/u2a-next.log
          exit 1
      - run: node e2e/pen-u2a.mjs
        env:
          BASE: http://localhost:3000
