# Every push and pull request: types, unit tests, Growth discovery source, Brand V2 baseline and a production build.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Growth discovery source
        run: npm run growth:discovery-test && npm run growth:discovery
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
      - name: Brand Guidelines V2 baseline
        run: npm run brand:baseline
      - name: Brand Guidelines V2 Phase 2 structural corpus
        run: npm run brand:phase2-corpus
      - name: Build
        run: npm run build

  brand-v2-visual:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'brand-guidelines-v2') || startsWith(github.head_ref, 'brand-v2'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render Brand Guidelines V2 visual baseline
        run: npm run brand:visual-baseline
      - name: Render Phase 2 IR visual proof
        run: npm run brand:phase2-visual
      - name: Measure legacy to IR parity
        run: node e2e/brand-ir-parity.mjs
      - name: Gate legacy to IR parity
        run: node e2e/brand-ir-parity-gate.mjs
      - name: Build for Brand browser regression
        run: npm run build
      - name: Run Brand phone regression
        run: |
          npx next start -p 3123 >/tmp/brand-v2-next.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3123/brand >/dev/null; then break; fi
            sleep 1
          done
          BASE=http://localhost:3123 node e2e/guided-workspace.mjs
      - name: Upload visual baseline
        uses: actions/upload-artifact@v4
        with:
          name: brand-v2-baseline
          path: |
            e2e/.out/brand-diversity
            e2e/.out/brand-ir-parity
          if-no-files-found: error
          retention-days: 14
