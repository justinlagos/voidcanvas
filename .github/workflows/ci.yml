# Every push and pull request: types, unit tests, Brand V2 baseline and a production build.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
      - name: Brand Guidelines V2 baseline
        run: npm run brand:baseline
      - name: Build
        run: npm run build
