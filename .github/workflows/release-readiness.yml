# Manual, zero-cost-capable release verification. It NEVER deploys or writes secrets.
# A passing check is NOT permission to merge or publish.
name: Release readiness (no deploy)
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full, reviewed 40-character commit SHA to verify'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-readiness-${{ inputs.commit_sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate immutable commit input
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Supply an exact 40-character commit SHA"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Verify HEAD is the requested commit
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit and contract tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Start real Next.js server
        run: |
          (npm run start -- -p 3000 > /tmp/voidcanvas-release-next.log 2>&1 & echo $! > /tmp/voidcanvas-release-next.pid)
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 2
          done
          cat /tmp/voidcanvas-release-next.log
          exit 1
      - name: Route smoke tests
        run: |
          for route in / /editor /effects /studio /brand /learn; do
            echo "Checking $route"
            curl --fail --silent --show-error --max-time 30 --output /dev/null "http://127.0.0.1:3000$route"
          done
      - name: Chromium and C1 real-editor regression
        run: |
          npx playwright install --with-deps chromium
          BASE=http://127.0.0.1:3000 node e2e/native-asset-flow.mjs
      - name: Publish evidence (not a deployment artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-evidence
          path: |
            e2e/evidence/
            /tmp/voidcanvas-release-next.log
          if-no-files-found: warn
          retention-days: 7
