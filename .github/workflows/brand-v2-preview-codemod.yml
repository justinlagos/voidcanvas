name: Brand V2 preview codemod

on:
  push:
    branches: [brand-v2-phase2-preview-switch]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[brand-preview-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-v2-phase2-preview-switch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply preview switch
        run: python scripts/brand-v2-preview-switch.py
      - name: Remove one-shot codemod files
        run: rm scripts/brand-v2-preview-switch.py .github/workflows/brand-v2-preview-codemod.yml
      - name: Commit preview switch
        run: |
          git config user.name "voidcanvas-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/studio/BrandGuideline.tsx scripts/brand-v2-preview-switch.py .github/workflows/brand-v2-preview-codemod.yml
          git commit -m "Switch Brand preview to V2 renderer [brand-preview-codemod]"
          git push origin HEAD:brand-v2-phase2-preview-switch
