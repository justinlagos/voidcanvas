name: Cascade identity and override integrity
on:
  pull_request:
    paths:
      - 'src/editor/cascade.ts'
      - 'src/editor/cascade-integrity.ts'
      - 'src/editor/__tests__/cascade-integrity.test.ts'
      - 'e2e/cascade-integrity.mjs'
      - '.github/workflows/cascade-integrity.yml'
  workflow_dispatch:
jobs:
  cascade-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run src/editor/__tests__/cascade-integrity.test.ts src/editor/unified
      - run: npx playwright install --with-deps chromium
      - run: npm run build || npm run build
      - run: |
          (npx next start -p 3000 > /tmp/cascade-next.log 2>&1 &) 
          for i in $(seq 1 60); do if curl -sf -o /dev/null http://localhost:3000; then exit 0; fi; sleep 5; done
          cat /tmp/cascade-next.log
          exit 1
      - run: node e2e/cascade-integrity.mjs
        env:
          BASE: http://localhost:3000
