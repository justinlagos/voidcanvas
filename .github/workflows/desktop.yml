# Builds the desktop app for Windows, macOS and Linux.
# Push a tag like desktop-v0.1.0 to build, attach the files to a GitHub release and publish it
# (the installed apps update from there). Run by hand from the Actions tab to build without releasing.
#
# Signing is optional. Add these repository secrets when the certificates exist:
#   macOS:   MAC_CERTS (base64 .p12), MAC_CERTS_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# Without them the builds are unsigned: Windows shows a SmartScreen warning and macOS asks the person to
# allow the app in System Settings. macOS apps only update themselves when signed.

name: Desktop app

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build the app
        run: npm run build:desktop

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: cd desktop && npm version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version

      - name: Test the desktop app (Linux)
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          xvfb-run -a node e2e/desktop.mjs

      - name: Package
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTS != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then npx electron-builder --publish always; else npx electron-builder --publish never; fi

      - uses: actions/upload-artifact@v4
        with:
          name: voidcanvas-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.yml
          if-no-files-found: ignore

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${GITHUB_REF_NAME#desktop-v}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
