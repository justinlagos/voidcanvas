# Builds the desktop app for Windows, macOS and Linux.
# To release: raise "version" in desktop/package.json and push to master. If there is no published GitHub
# release for that version yet, all three builds are collected and published as release v<version>; the
# installed apps update from there. Run by hand from the Actions tab to build without releasing.
#
# Signing is optional. Add these repository secrets when the certificates exist:
#   macOS:   MAC_CERTS (base64 .p12), MAC_CERTS_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# Without them the builds are unsigned: Windows shows a SmartScreen warning and macOS asks the person to
# allow the app in System Settings. macOS apps only update themselves when signed.

name: Desktop app

on:
  push:
    branches: [master]
    paths: ['desktop/package.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # Release unless v<version> is already published.
          DRAFT=$(gh release view "v$VER" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$DRAFT" != "false" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build the app
        run: npm run build:desktop

      - name: Test the desktop app (Linux)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 blocks the unprivileged namespaces Electron's sandbox uses; allow them on the test machine.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npx playwright install --with-deps chromium
          xvfb-run -a node e2e/desktop.mjs

      - name: Package
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERTS: ${{ secrets.WIN_CSC_LINK }}
          WIN_CERTS_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # electron-builder reads an empty CSC_LINK as a path, so only set signing variables that have values.
          EXTRA=()
          if [ -n "$MAC_CERTS" ]; then export CSC_LINK="$MAC_CERTS" CSC_KEY_PASSWORD="$MAC_CERTS_PASSWORD"
          else
            # No Apple certificate: sign ad hoc. An app with no signature at all is reported by macOS on Apple
            # silicon as "damaged"; an ad-hoc signed one can be opened from System Settings, Privacy & Security.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "$RUNNER_OS" = "macOS" ]; then EXTRA=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          fi
          if [ -n "$WIN_CERTS" ]; then export WIN_CSC_LINK="$WIN_CERTS" WIN_CSC_KEY_PASSWORD="$WIN_CERTS_PASSWORD"; fi
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx electron-builder --publish never "${EXTRA[@]}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Fail the build if the app would show as damaged.
            for app in dist/mac*/Voidcanvas.app; do codesign --verify --deep --strict --verbose=2 "$app"; done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: voidcanvas-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          ls -la files
          # Remove drafts left by earlier runs, so there is one release per version.
          gh release list --repo "$REPO" --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName' | while read -r t; do gh release delete "$t" --repo "$REPO" --yes || true; done
          if gh release view "v$VER" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "v$VER" files/* --repo "$REPO" --clobber
          else
            gh release create "v$VER" files/* --repo "$REPO" --target "$GITHUB_SHA" --title "Voidcanvas $VER" --notes "Download for Windows, Mac or Linux at https://voidcanvas.netlify.app/download" --latest
          fi
