# Sprint C1+C2 browser evidence gate: e2e/native-asset-flow.mjs + e2e/generation-flow.mjs.
# - pull_request: builds + serves the exact PR commit locally, then tests it.
# - workflow_dispatch with `base`: tests a given exact-commit preview URL.
name: Native asset flow browser gate
on:
  pull_request:
    paths: ['src/editor/assets/**', 'src/editor/components/AssetTray.tsx', 'src/editor/components/PropertiesPanel.tsx', 'src/editor/components/FloatingBar.tsx', 'src/editor/components/Stage.tsx', 'src/editor/components/AddMenu.tsx', 'src/editor/components/Dock.tsx', 'src/editor/components/EditorShell.tsx', 'src/editor/io.ts', 'src/editor/types.ts', 'src/editor/ui-store.ts', 'src/editor/actions.ts', 'e2e/native-asset-flow.mjs', 'e2e/generation-flow.mjs', 'src/editor/generation/**', '.github/workflows/native-asset-flow.yml']
  workflow_dispatch:
    inputs:
      base:
        description: 'Exact-commit preview URL to test (skips local build)'
        required: false
        default: ''
jobs:
  assetflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run src/editor/assets src/editor/unified
      - run: npx playwright install --with-deps chromium
      - if: inputs.base == ''
        run: npm run build || npm run build
      - if: inputs.base == ''
        run: (npx next start -p 3000 > /tmp/next-start.log 2>&1 &) && for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000 && break; sleep 5; done; curl -sf -o /dev/null http://localhost:3000 || (cat /tmp/next-start.log; exit 1)
      - run: node e2e/native-asset-flow.mjs
        env:
          BASE: ${{ inputs.base != '' && inputs.base || 'http://localhost:3000' }}
      - run: node e2e/generation-flow.mjs
        env:
          BASE: ${{ inputs.base != '' && inputs.base || 'http://localhost:3000' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: native-asset-flow-evidence, path: e2e/evidence/ }
